[project]
name = "glm-stock-swarm"
version = "0.1.0"
description = "A local multi-agent stock analyst powered by GLM-5.3-Flash and CrewAI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai==1.15.18",
    "crewai-tools==1.15.18",
    "finnhub-python==2.4.29",
    "ipykernel==7.3.0",
    "jupyter==1.1.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "numpy==2.5.2",
    "openai==2.54.0",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "tavily-python==0.8.0",
    "textual==8.2.8",
]

[project.scripts]
glm-stock-swarm = "tui:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["stock_swarm", "tui"]
