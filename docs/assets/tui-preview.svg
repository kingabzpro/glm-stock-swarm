<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title description">
  <title id="title">GLM Stock Swarm terminal interface</title>
  <desc id="description">A compact dark-blue terminal application showing a completed four-agent stock analysis and a grounded portfolio-manager follow-up.</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091525"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .title { fill: #80d8ff; font-size: 24px; font-weight: 700; letter-spacing: 0.8px; }
      .body { fill: #d9e7ff; font-size: 21px; }
      .small { fill: #9ec5ef; font-size: 18px; }
      .muted { fill: #8fa9c9; }
      .accent { fill: #45c4ff; }
      .strong { fill: #ffffff; font-weight: 700; }
      .success { fill: #55d187; }
      .key { fill: #ffb454; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="850" rx="12" fill="#030914"/>
  <rect x="8" y="8" width="1584" height="834" rx="9" fill="url(#screen)" stroke="#284b75" stroke-width="2" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="10" y="10" width="1580" height="50" rx="7" fill="#0c1c33"/>
  <text x="800" y="42" text-anchor="middle" class="mono title">GLM Stock Swarm</text>

  <!-- Ticker controls -->
  <rect x="24" y="76" width="1318" height="66" rx="4" fill="#0c1c33" stroke="#45c4ff" stroke-width="2"/>
  <text x="50" y="117" class="mono body">SPCX</text>
  <rect x="1364" y="76" width="212" height="66" rx="4" fill="#146c94" stroke="#45c4ff" stroke-width="2"/>
  <text x="1470" y="118" text-anchor="middle" class="mono strong" font-size="22">Analyze</text>

  <!-- Status and agent progress -->
  <text x="24" y="173" class="mono small">Follow-up answered · Ask another question or analyze a new ticker</text>

  <circle cx="35" cy="203" r="6" fill="#55d187"/>
  <text x="51" y="210" class="mono small">Fundamentals</text>
  <circle cx="252" cy="203" r="6" fill="#55d187"/>
  <text x="268" y="210" class="mono small">Technicals</text>
  <circle cx="449" cy="203" r="6" fill="#55d187"/>
  <text x="465" y="210" class="mono small">News</text>
  <circle cx="558" cy="203" r="6" fill="#55d187"/>
  <text x="574" y="210" class="mono small">Decision</text>

  <!-- Report -->
  <rect x="24" y="228" width="1552" height="426" rx="5" fill="#0a1729" stroke="#284b75" stroke-width="2"/>

  <text x="50" y="272" class="mono body accent" font-weight="700">You</text>
  <text x="50" y="314" class="mono body">Do I sell all of my stocks?</text>

  <text x="50" y="370" class="mono body accent" font-weight="700">Portfolio Manager</text>
  <text x="50" y="416" class="mono body">
    <tspan class="strong">Short answer:</tspan>
    <tspan> The report supports a </tspan>
    <tspan class="strong">SELL</tspan>
    <tspan> signal on SPCX, but it cannot tell you whether to sell</tspan>
  </text>
  <text x="50" y="450" class="mono body">your entire position—the report does not contain enough information about your goals or risk tolerance.</text>

  <line x1="50" y1="478" x2="1550" y2="478" stroke="#284b75" stroke-width="1"/>
  <text x="50" y="519" class="mono strong" font-size="21">What the report does say:</text>

  <circle cx="59" cy="557" r="4" fill="#45c4ff"/>
  <text x="78" y="564" class="mono body">The final signal is SELL (36/100, 60% confidence), supported across the tested weighting schemes.</text>
  <circle cx="59" cy="596" r="4" fill="#45c4ff"/>
  <text x="78" y="603" class="mono body">Fundamental, technical, and recent-news evidence point to material execution and valuation risk.</text>
  <circle cx="59" cy="635" r="4" fill="#45c4ff"/>
  <text x="78" y="642" class="mono body">Bullish catalysts remain, but the report judges them insufficient to offset the identified downside.</text>

  <!-- Follow-up controls -->
  <rect x="24" y="674" width="1318" height="66" rx="4" fill="#0c1c33" stroke="#284b75" stroke-width="2"/>
  <text x="50" y="715" class="mono body muted">Ask about this report</text>
  <rect x="1364" y="674" width="212" height="66" rx="4" fill="#146c94" stroke="#45c4ff" stroke-width="2"/>
  <text x="1470" y="716" text-anchor="middle" class="mono strong" font-size="22">Ask</text>

  <!-- Disclaimer and shortcuts -->
  <text x="800" y="779" text-anchor="middle" class="mono small muted">Research only · Not financial advice</text>
  <rect x="10" y="802" width="1580" height="38" rx="0" fill="#0c1c33"/>
  <text x="24" y="828" class="mono small">
    <tspan class="key">^q</tspan><tspan fill="#d9e7ff"> Quit</tspan>
    <tspan dx="28" class="key">^r</tspan><tspan fill="#d9e7ff"> Research</tspan>
    <tspan dx="28" class="key">^l</tspan><tspan fill="#d9e7ff"> Clear</tspan>
  </text>
  <text x="1570" y="828" text-anchor="end" class="mono small">
    <tspan class="key">^p</tspan><tspan fill="#d9e7ff"> palette</tspan>
  </text>
</svg>
